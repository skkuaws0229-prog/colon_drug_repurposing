<script>
function updateStep(completedSteps, activeStep, metrics) {
  for (let i = 1; i <= 7; i++) {

  document.getElementById('progress-pct').textContent = completedSteps + ' / 7 ?④퀎';
  document.getElementById('bar-fill').style.width = (completedSteps / 7 * 100).toFixed(1) + '%';
  if (metrics && activeStep) {
    const target = completedSteps;
    const mc = document.getElementById('metrics-' + target);
    if (mc) {
      mc.innerHTML = '';
      for (const [k, v] of Object.entries(metrics)) {
        mc.innerHTML += '<div class="metric"><span class="label">' + k + ':</span><span class="value">' + v + '</span></div>';
      }
    }
    document.getElementById('ts-' + target).textContent = '?꾨즺: ' + new Date().toLocaleString();
  }
  localStorage.setItem('pipeline_state', JSON.stringify({completedSteps, activeStep, ts: new Date().toISOString()}));
}
